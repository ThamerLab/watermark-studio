name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Shellcheck installers
        run: shellcheck install.sh update.sh uninstall.sh

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build -t watermark-studio:test .
      - name: Start and verify health
        run: |
          docker run -d --name watermark-studio-test -p 18080:8080 watermark-studio:test
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:18080/health | grep -q healthy; then exit 0; fi
            sleep 4
          done
          docker logs watermark-studio-test
          exit 1
      - name: Verify real PowerPoint conversion
        run: |
          python3 -m pip install --quiet python-pptx
          python3 - <<'PY'
          from pptx import Presentation
          deck = Presentation()
          slide = deck.slides.add_slide(deck.slide_layouts[1])
          slide.shapes.title.text = "Watermark Studio"
          slide.placeholders[1].text = "اختبار تحويل PowerPoint باللغة العربية"
          deck.save("/tmp/watermark-studio.pptx")
          PY
          curl -fsS -F "file=@/tmp/watermark-studio.pptx" http://127.0.0.1:18080/api/jobs \
            | python3 -c "import json,sys; result=json.load(sys.stdin); assert result['page_count'] == 1 and result['preview_url']"
