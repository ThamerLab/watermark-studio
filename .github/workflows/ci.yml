name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Shellcheck installers
        run: shellcheck install.sh update.sh uninstall.sh

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build -t watermark-studio:test .
      - name: Start and verify health
        run: |
          docker run -d --name watermark-studio-test -p 18080:8080 watermark-studio:test
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:18080/health | grep -q healthy; then exit 0; fi
            sleep 4
          done
          docker logs watermark-studio-test
          exit 1
