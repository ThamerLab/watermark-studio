name: watermark-studio
services:
  app:
    build:
      context: .
    image: watermark-studio:local
    container_name: watermark-studio
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      FILE_RETENTION_MINUTES: "${FILE_RETENTION_MINUTES:-60}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-100}"
      LIBREOFFICE_TIMEOUT_SECONDS: "${LIBREOFFICE_TIMEOUT_SECONDS:-180}"
      MAX_BATCH_FILES: "${MAX_BATCH_FILES:-20}"
      MAX_BATCH_ROWS: "${MAX_BATCH_ROWS:-100}"
      MAX_BATCH_OUTPUTS: "${MAX_BATCH_OUTPUTS:-500}"
      MAX_BATCH_TOTAL_MB: "${MAX_BATCH_TOTAL_MB:-500}"
    volumes:
      - watermark-data:/app/data
    tmpfs:
      - /tmp:size=512m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3))['status']=='healthy'"]
      interval: 20s
      timeout: 5s
      start_period: 90s
      retries: 5
volumes:
  watermark-data:
