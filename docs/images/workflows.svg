<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 290" role="img" aria-labelledby="t d"><title id="t">Watermark Studio workflows</title><desc id="d">Illustration: single PDF to stamped PDF, or multiple PDFs plus CSV to organized ZIP; all in your browser</desc><rect width="1160" height="290" fill="#0e1b31" rx="18"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="580" y="38" font-size="23" font-weight="bold" fill="#e2e8f0">Two ways to watermark</text><rect x="36" y="75" width="216" height="74" rx="12" fill="#223b5d" stroke="#5e9fed"/><text x="144" y="104" font-size="20" fill="#fff">PDF + text</text><text x="144" y="128" font-size="15" fill="#a4d4ff">Single document</text><path d="M260 111H359" stroke="#46d6bd" stroke-width="4"/><path d="M350 103l12 8-12 8" fill="none" stroke="#46d6bd" stroke-width="4"/><rect x="367" y="75" width="380" height="74" rx="12" fill="#11483f" stroke="#50d5ae"/><text x="557" y="105" font-size="22" fill="#fff">Browser processing</text><text x="557" y="130" font-size="14" fill="#afefdb">Local · private · preview before export</text><path d="M756 111H855" stroke="#46d6bd" stroke-width="4"/><path d="M847 103l12 8-12 8" fill="none" stroke="#46d6bd" stroke-width="4"/><rect x="865" y="75" width="257" height="74" rx="12" fill="#223b5d" stroke="#5e9fed"/><text x="993" y="105" font-size="21" fill="#fff">Stamped PDF</text><text x="993" y="128" font-size="15" fill="#a4d4ff">Download</text><rect x="36" y="183" width="216" height="74" rx="12" fill="#223b5d" stroke="#5e9fed"/><text x="144" y="211" font-size="20" fill="#fff">PDFs + CSV</text><text x="144" y="235" font-size="15" fill="#a4d4ff">Batch processing</text><path d="M260 220H359" stroke="#46d6bd" stroke-width="4"/><path d="M350 212l12 8-12 8" fill="none" stroke="#46d6bd" stroke-width="4"/><rect x="367" y="183" width="380" height="74" rx="12" fill="#11483f" stroke="#50d5ae"/><text x="557" y="211" font-size="22" fill="#fff">Browser processing</text><text x="557" y="236" font-size="14" fill="#afefdb">One output for each PDF × CSV row</text><path d="M756 220H855" stroke="#46d6bd" stroke-width="4"/><path d="M847 212l12 8-12 8" fill="none" stroke="#46d6bd" stroke-width="4"/><rect x="865" y="183" width="257" height="74" rx="12" fill="#223b5d" stroke="#5e9fed"/><text x="993" y="211" font-size="21" fill="#fff">Organized ZIP</text><text x="993" y="235" font-size="15" fill="#a4d4ff">PDFs + manifest.csv</text></g></svg>